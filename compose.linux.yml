# Linux-only deployment: Ollama runs as a CONTAINER too.
#
# Unlike macOS (where Ollama must stay native for Metal GPU access), on Linux
# the GPU is reachable from inside Docker, so the whole stack can be one compose:
#
#   ACCESS_CODE=your-code docker compose -f compose.linux.yml up -d --build
#
# qa-ai auto-pulls the model into the named volume on first boot.
# For an NVIDIA GPU, install the NVIDIA Container Toolkit and uncomment the
# `deploy.resources` block below; without it, Ollama runs on CPU (slower).
services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama   # persist pulled models across restarts
    ports:
      - "11434:11434"
    restart: unless-stopped
    # --- NVIDIA GPU (optional) ---
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  qa-ai:
    build:
      context: ./services/qa-ai
    environment:
      QA_AI_ADDR: ":8081"
      OLLAMA_URL: "http://ollama:11434"   # reach the sibling container by name
      OLLAMA_MODEL: "qwen2.5:7b"
      OLLAMA_AUTO_PULL: "true"
      QA_IN_CONTAINER: "1"
    depends_on:
      - ollama
    restart: unless-stopped
    expose:
      - "8081"

  qa-core:
    build:
      context: ./services/qa-core
    environment:
      QA_CORE_ADDR: ":8080"
      QA_AI_URL: "http://qa-ai:8081"
      ACCESS_CODE: "${ACCESS_CODE:?set ACCESS_CODE in the deploy environment}"
    depends_on:
      - qa-ai
    restart: unless-stopped
    ports:
      - "8080:8080"

volumes:
  ollama-models:
